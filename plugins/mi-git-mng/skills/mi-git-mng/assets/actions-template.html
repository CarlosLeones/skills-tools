<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --code-bg: #f6f8fa; --accent: #0969da; --table-alt: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --code-bg: #151b23; --accent: #4493f8; --table-alt: #151b23;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  h1, h2, h3 { line-height: 1.25; margin: 1.6em 0 0.6em; }
  h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: 0; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  a { color: var(--accent); }
  code { background: var(--code-bg); padding: .15em .35em; border-radius: 6px; font-size: 85%;
         font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
  pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 1em 0; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
  tr:nth-child(2n) td { background: var(--table-alt); }
  blockquote { margin: 1em 0; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
  .mermaid { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
             padding: 16px; overflow-x: auto; text-align: center; }
  .footer { color: var(--muted); font-size: 13px; margin-top: 48px; }
  #error { display: none; color: #cf222e; }
</style>
</head>
<body>
<main>
  <div id="content">Cargando…</div>
  <p id="error">No se pudieron cargar las librerías (sin conexión). El informe está en el .md con el mismo nombre.</p>
  <p class="footer">Generado con mi-git-mng view_actions.</p>
</main>

<script type="text/markdown" id="md">__MARKDOWN__</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  (function () {
    var content = document.getElementById("content");
    if (!window.marked || !window.mermaid) {
      content.style.display = "none";
      document.getElementById("error").style.display = "block";
      return;
    }
    content.innerHTML = marked.parse(document.getElementById("md").textContent);

    // ```mermaid → <pre class="mermaid"> para que mermaid lo dibuje.
    content.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
      var pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = code.textContent;
      code.parentElement.replaceWith(pre);
    });

    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
    mermaid.run({ querySelector: ".mermaid" });
  })();
</script>
</body>
</html>
